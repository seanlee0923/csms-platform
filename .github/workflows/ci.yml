name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  test:
    name: build / test / vet / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go build ./...

      - run: go test ./... -count=1

      - run: go test -race ./...

      - run: go vet ./...

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would reformat:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod / go.sum up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  manifests:
    name: kustomize render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for dir in config/crd config/rbac config/manager config/operator config/runtime; do
            echo "kustomize build $dir"
            kubectl kustomize "$dir" >/dev/null
          done

  container-scan:
    name: build + scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            dockerfile: Dockerfile
            image: csms-runtime:ci
          - name: operator
            dockerfile: Dockerfile.operator
            image: csms-operator:ci
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: csms-runtime
  labels:
    app.kubernetes.io/name: csms-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: csms-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: csms-runtime
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: runtime
          image: csms-runtime:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: csms-runtime
            - secretRef:
                name: csms-runtime-database
                optional: true
            - secretRef:
                name: csms-runtime-redis
                optional: true
            - secretRef:
                name: csms-runtime-api
                optional: true
          env:
            - name: CSMS_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

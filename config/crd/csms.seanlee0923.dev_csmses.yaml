---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: csmses.csms.seanlee0923.dev
spec:
  group: csms.seanlee0923.dev
  names:
    kind: CSMS
    listKind: CSMSList
    plural: csmses
    singular: csms
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CSMS is the Schema for the csms API. It describes the deployment of an
          OCPP runtime container: the Runtime Deployment, Service, ConfigMap and,
          optionally, an Ingress and a PodDisruptionBudget. It is not specific to
          this repository's reference cmd/csms-server image — any container that
          honors the Port/LivenessPath/ReadinessPath contract can be deployed. The
          Operator never creates the Secrets it references; those remain
          externally managed.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CSMSSpec defines the desired state of an OCPP runtime deployment. The
              Operator treats the container at Image as opaque: any runtime built on
              the ocpp library that listens on Port and serves LivenessPath/
              ReadinessPath can be deployed, not just this repository's reference
              cmd/csms-server.
            properties:
              apiSecretName:
                default: ""
                description: |-
                  APISecretName references an existing Secret injected into the
                  Runtime container via envFrom. The Operator does not create this
                  Secret and does not inspect its keys. Leave empty to omit it.
                pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              config:
                additionalProperties:
                  type: string
                description: |-
                  Config holds arbitrary environment variables applied through the
                  ConfigMap the Operator manages. Keys and values are opaque to the
                  Operator — it makes no assumption about which env vars any given
                  runtime image reads.
                type: object
              databaseSecretName:
                default: ""
                description: |-
                  DatabaseSecretName references an existing Secret injected into the
                  Runtime container via envFrom. The Operator does not create this
                  Secret and does not inspect its keys. Leave empty to omit it.
                pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              image:
                description: |-
                  Image is the OCPP runtime container image, for example
                  "csms-runtime:0.1.0".
                minLength: 1
                type: string
              ingress:
                description: |-
                  Ingress optionally exposes the Runtime Service through a Kubernetes
                  Ingress. Leave unset to skip creating an Ingress entirely — most
                  deployments terminate TLS at a platform-managed Ingress/Gateway that
                  targets the Runtime Service directly, without the Operator's
                  involvement. Set this only when a single CSMS resource should own its
                  own Ingress end to end.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations are applied verbatim to the generated Ingress, for example
                      WebSocket timeout or buffering settings specific to the Ingress
                      controller in use.
                    type: object
                  host:
                    description: Host is the DNS hostname routed to the Runtime Service.
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  ingressClassName:
                    description: |-
                      IngressClassName selects the Ingress controller, for example "nginx".
                      Leave empty to use the cluster default IngressClass.
                    pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  tlsSecretName:
                    description: |-
                      TLSSecretName references an existing Secret with a TLS certificate for
                      Host. The Operator does not create this Secret. Leave empty to serve
                      plain HTTP through the Ingress, which is not appropriate for OCPP
                      endpoints reachable outside a trusted network.
                    pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - host
                type: object
              livenessPath:
                default: /livez
                description: |-
                  LivenessPath is the HTTP path the Runtime serves for its liveness
                  probe.
                pattern: ^/
                type: string
              minAvailable:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  MinAvailable configures a PodDisruptionBudget for the Runtime
                  Deployment. Leave unset to skip creating a PodDisruptionBudget.
                x-kubernetes-int-or-string: true
              port:
                default: 8080
                description: |-
                  Port is the container port the Runtime listens on for HTTP traffic,
                  used for the Service target port and the liveness/readiness probes.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              readinessPath:
                default: /readyz
                description: |-
                  ReadinessPath is the HTTP path the Runtime serves for its readiness
                  probe.
                pattern: ^/
                type: string
              redisSecretName:
                default: ""
                description: |-
                  RedisSecretName references an existing Secret injected into the
                  Runtime container via envFrom. The Operator does not create this
                  Secret and does not inspect its keys. Leave empty to disable
                  distributed session ownership; Replicas must then be 1.
                pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              replicas:
                default: 1
                description: Replicas is the desired Runtime replica count.
                format: int32
                minimum: 1
                type: integer
              resources:
                description: Resources sets the Runtime container resource requests
                  and limits.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              terminationGracePeriodSeconds:
                default: 30
                description: |-
                  TerminationGracePeriodSeconds bounds how long Kubernetes waits after
                  SIGTERM before killing the Runtime Pod, giving it time to drain
                  in-flight OCPP sessions and command handling on shutdown.
                format: int64
                minimum: 0
                type: integer
              tls:
                description: |-
                  TLS optionally mounts a server certificate (and, for mutual TLS, a
                  client CA bundle) into the Runtime container so the Runtime itself
                  terminates TLS — distinct from, and independent of, Ingress-terminated
                  TLS. Leave unset to serve plain HTTP. Most deployments should prefer
                  Ingress-terminated TLS (see Ingress above); set this only when the
                  Runtime itself must see the client certificate (mutual TLS / OCPP
                  Security Profile 3) or there is no Ingress in the path (TLS
                  passthrough). The Operator only mounts the referenced Secrets — it
                  never creates or renews certificate content, and it has no way to
                  verify that the deployed Runtime actually implements TLS termination
                  at these paths.
                properties:
                  clientCASecretName:
                    description: |-
                      ClientCASecretName references an existing Secret with a CA bundle
                      used to verify client certificates for mutual TLS. Leave empty for
                      TLS without client certificate verification.
                    pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  secretName:
                    description: |-
                      SecretName references an existing Secret with a TLS certificate and
                      private key. The Operator does not create or renew this Secret.
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - secretName
                type: object
            required:
            - image
            type: object
            x-kubernetes-validations:
            - message: 'redisSecretName is required when replicas is greater than
                1: a Runtime with process-local session state cannot safely run more
                than one replica without distributed session ownership'
              rule: '!(self.replicas > 1) || size(self.redisSecretName) > 0'
          status:
            description: CSMSStatus reflects the observed state of a CSMS Runtime
              deployment.
            properties:
              conditions:
                description: Conditions holds the latest observed status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the CSMS generation the Operator last
                  reconciled.
                format: int64
                type: integer
              readyReplicas:
                description: ReadyReplicas is the observed Deployment ready replica
                  count.
                format: int32
                type: integer
              replicas:
                description: Replicas is the observed Deployment replica count.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

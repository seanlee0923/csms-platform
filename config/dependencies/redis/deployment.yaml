apiVersion: apps/v1
kind: Deployment
metadata:
  name: csms-redis
  labels:
    app.kubernetes.io/name: csms-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: csms-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: csms-redis
    spec:
      containers:
        - name: redis
          image: redis:8.8.1-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - exec redis-server --appendonly no --save "" --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: csms-redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
